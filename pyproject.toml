[project]
name = "credit-option-skew"
version = "0.1.0"
description = "Does credit ETF option skew predict spread widening once the mechanical price-space part is stripped out?"
requires-python = ">=3.11"
dependencies = [
    # installed from the sibling checkout while developing; pin to a git tag,
    # e.g. "credit-engine @ git+https://github.com/owensharpe/credit-engine@v0.2.0",
    # once the paper's results are frozen
    "credit-engine",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skew*"]
